<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analisis Sentimen RNN</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .container { background: #fff; padding: 30px 40px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); text-align: center; }
        h1 { color: #333; }
        textarea { width: 100%; padding: 10px; border-radius: 5px; border: 1px solid #ddd; margin-top: 10px; font-size: 16px; }
        button { background-color: #007bff; color: white; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; font-size: 16px; margin-top: 20px; }
        button:hover { background-color: #0056b3; }
        .flash { color: red; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Analisis Sentimen Kalimat</h1>
        <p>Masukkan kalimat berbahasa Inggris untuk diprediksi sentimennya.</p>
        <form action="/predict" method="post">
            <textarea name="text" rows="4" placeholder="Contoh: this movie is very good"></textarea>
            <br>
            <button type="submit">Prediksi</button>
        </form>
        {% with messages = get_flashed_messages() %}
            {% if messages %}
                <div class="flash">{{ messages[0] }}</div>
            {% endif %}
        {% endwith %}
    </div>
</body>
</html>
